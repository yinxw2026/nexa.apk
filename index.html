<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Nexa</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.4"/><path d="M19.4 14.6a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
<symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></symbol>
<symbol id="i-globe2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></symbol>
<symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h1.6a2 2 0 0 0 1.5-3.3 2 2 0 0 1 1.5-3.3h2.9A3.5 3.5 0 0 0 23 11 9 9 0 0 0 12 3z"/><circle cx="7.5" cy="12" r="1.1"/><circle cx="10.5" cy="8" r="1.1"/><circle cx="15" cy="8.5" r="1.1"/></symbol>
<symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5M3 17l9 5 9-5"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20v-7M10 20V5M16 20v-9M3 20h18"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5z"/><path d="M8 3v18"/></symbol>
<symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19.5V5M5.5 11.5L12 5l6.5 6.5"/></symbol>
<symbol id="i-paperclip" viewBox="0 0 24 24"><path d="M20.5 11.5l-8.2 8.2a5 5 0 0 1-7-7l8.4-8.4a3.4 3.4 0 0 1 4.8 4.8l-8.4 8.4a1.8 1.8 0 0 1-2.5-2.5l7.7-7.7"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></symbol>
<symbol id="i-brain" viewBox="0 0 24 24"><path d="M12 3.2l1.9 5.4 5.4 1.9-5.4 1.9L12 17.8l-1.9-5.4-5.4-1.9 5.4-1.9z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.4"/><path d="M5.5 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v.5"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4.5v5h-5"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l1 13h9l1-13"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L20.5 7.5l-4-4L4 16z"/><path d="M14.5 5.5l4 4"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19.5 7"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.4"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15.5V3.5M7.5 8L12 3.5 16.5 8"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="14" r="4"/><path d="M11 11l8-8M17 5l2 2M14.5 7.5l2 2"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10" rx="2.4"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></symbol>
<symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.4"/><circle cx="8.5" cy="10" r="1.6"/><path d="M4 17l5-4.5 4 3.5 3-2.5 4 3.5"/></symbol>
<symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5h.01"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8h.01"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-9.4A4.1 4.1 0 0 1 12 7.8a4.1 4.1 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/></symbol>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 13.5h5.5L11 21l8-10.5h-5.5z"/></symbol>
</defs></svg>

<div id="boot" class="boot"><div class="boot-logo" id="boot-logo"></div><div class="boot-text">NEXA</div></div>

<div id="app" hidden>
  <section id="chat" class="view">
    <header class="bar">
      <button class="iconbtn" id="btn-drawer"><svg class="i"><use href="#i-menu"/></svg></button>
      <div class="bar-mid">
        <span class="bar-title" id="chat-title">Nexa</span>
        <button class="chip" id="btn-model"><span class="chip-dot"></span><span id="chip-model"></span><svg class="i i12"><use href="#i-down"/></svg></button>
      </div>
      <button class="iconbtn" id="btn-newchat"><svg class="i"><use href="#i-plus"/></svg></button>
    </header>

    <div class="stream" id="stream"><div class="stream-inner" id="stream-inner"></div></div>

    <div class="composer" id="composer">
      <div class="attach-row" id="attach-row"></div>
      <div class="composer-box">
        <textarea id="input" rows="1" autocomplete="off" autocapitalize="sentences"></textarea>
        <div class="composer-tools">
          <button class="toolbtn" id="btn-attach"><svg class="i"><use href="#i-paperclip"/></svg></button>
          <button class="toolbtn" id="btn-web"><svg class="i"><use href="#i-globe"/></svg></button>
          <button class="toolbtn" id="btn-think"><svg class="i"><use href="#i-brain"/></svg><span class="tool-cap" id="think-cap"></span></button>
          <div class="spacer"></div>
          <button class="sendbtn" id="btn-send"><svg class="i"><use href="#i-arrow-up"/></svg></button>
        </div>
      </div>
    </div>
  </section>

  <aside id="drawer">
    <div class="drawer-head">
      <div class="searchbox"><svg class="i"><use href="#i-search"/></svg><input id="conv-search"></div>
      <button class="iconbtn" id="btn-refresh-list"><svg class="i"><use href="#i-refresh"/></svg></button>
    </div>
    <button class="provider-row" id="btn-provider">
      <span class="avatar" id="provider-avatar">N</span>
      <span class="grow"><span class="provider-name" id="provider-name"></span><span class="provider-sub" id="provider-sub"></span></span>
      <svg class="i i12 dim"><use href="#i-down"/></svg>
    </button>
    <div class="conv-list" id="conv-list"></div>
    <div class="drawer-foot">
      <button class="langbtn" id="btn-lang"><span data-lang="zh">中</span><i>/</i><span data-lang="en">En</span></button>
      <div class="grow"></div>
      <button class="iconbtn" id="btn-theme"><svg class="i"><use href="#i-monitor"/></svg></button>
      <button class="iconbtn" id="btn-settings"><svg class="i"><use href="#i-gear"/></svg></button>
    </div>
  </aside>
  <div id="scrim"></div>
</div>

<input type="file" id="file-input" multiple
       style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0">

<div id="page" class="page-host" hidden></div>
<div id="sheet" class="sheet-host" hidden></div>
<div id="toasts"></div>

<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/md.js"></script>
<script src="js/readme.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
